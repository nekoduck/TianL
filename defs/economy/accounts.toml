# 账户（v0.2 的边界账户、寺院账户、铺户账户）。order 即原型 account 表的插入顺序（状态哈希按 rowid 遍历，不得改动）。
# boundary = 1：边界账户，可以透支（代表本地图之外的世界）；0：不得透支。
# opening_cash（贯）：开局由 EQUITY 注资，按 order 依次执行。year_end_cap（贯）：岁末超出部分转给 TOWN_BG（铺主家用与商税）。
# virtual = true：只作收款人/货主的占位名，不进 account 表（VILLAGE = 樵菜户全体，按人口分账）。
# 内核代码用 id 的最后一段当角色名取账户（如 account:shaolin:org -> 本寺账户），不写死 code。

