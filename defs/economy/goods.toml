# 品类（v0.2 的 GOODS 与 SHOP_BANDS）。order 即原型字典顺序。
#   price 单价（文，粮除外，粮价随季节、年景浮动）；use 寺院日用量；low 补货线（天）；up 补到（天）；
#   prio 缺钱时的审批优先级（小者先批；>= K.prio_reserve_from 者批前先留压库钱）；
#   band = [低线, 补到]：铺户（杂货行）自己的进货带；
#   restock = true：库头按 low/up 补货的“杂项”（按 order 依次检查）；
#   consume_order：每日消耗的检查次序（>0 才每日消耗）；
#   use_winter_extra / use_per_pilgrims / use_festival_mult：日用量的浮动（冬加量；每 N 香客加一；朔望节日乘数）；
#   spoil_cap：存量超此数当日腐坏；role：内核按角色取品类（staple 主粮、fuel 柴、fresh 鲜菜、textile 布、lumber 木料）。

