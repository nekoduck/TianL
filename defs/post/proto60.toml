# NPC 原型场景 scenario:proto60 的岗位、差事、性格刻度与几条站点级规则（scope = proto60）。
# 内核会加载 post 目录（按 scope 过滤，不读这里），所以本文件只引用 space/org/post/scenario 里的定义，不引用设施、规范、知识类。
# 次序敏感的定义带 order：岗位表的次序决定名册（谁排第几、法名与寮房）、工作板的次序决定同级差事的认领先后。

