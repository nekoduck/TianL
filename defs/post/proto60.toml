# ---------------------------------------------------------------- 层标签与计划 6.1 的层号（越轨与怠工不是一层包，记 0）
# 行为包的 layer 写这里登记过的标签；rank 只用于 explain 与统计（判定先后由栈的次序决定，不由 rank 决定）。
["rule:proto60:layers"]
ranks = [
  { name = "强制", rank = 1 }, { name = "处分", rank = 2 }, { name = "反应", rank = 3 }, { name = "值守", rank = 5 },
  { name = "生理", rank = 6 }, { name = "集体", rank = 7 }, { name = "岗位", rank = 8 }, { name = "身份", rank = 9 },
  { name = "差事", rank = 9 }, { name = "作息", rank = 9 }, { name = "自由", rank = 10 }, { name = "越轨", rank = 0 },
  { name = "怠工", rank = 0 },
]

# ---------------------------------------------------------------- 时间表
# night 夜间时辰（子 0 … 亥 11）；rotate = [日系数, 时辰系数]：各人决定的起点按 (日×a + 时辰×b) % 人数 轮转（保证工位预约公平且确定）；
# meal_slots 斋食时辰；seasons 季节与月份（行为包 when.season 用）；
# calendar 这处场所的历法（calendar 定义的编号）：行为包 when 里的 festival、month、day_of_month、season 键都按它，不按别处的历。
# 原型场景就是少林寺，所以引用少林寺历；另一处场所（丐帮分舵、庄园）写自己的 calendar 定义并改这一行。
["rule:proto60:schedule"]
calendar = "calendar:shaolin:main"
night = [11, 0, 1]
rotate = [7, 3]
meal_slots = [4, 6]
seasons = [
  { name = "春", months = [1, 2, 3] }, { name = "夏", months = [4, 5, 6] },
  { name = "秋", months = [7, 8, 9] }, { name = "冬", months = [10, 11, 12] },
]

# ---------------------------------------------------------------- 五项需求（计划 6.3；键 h 饥 e 困 c 洁 s 群 a 志）
# init 开局值；base 每时辰的基础消耗；names 报表里的中文名；活动的增减在各 interaction 的 effects，不在这里。
# 饥的消耗 = base.h × (1 + (T - hunger_t_mid) / hunger_t_div)，睡时用 hunger_sleep 代替 base.h；群的消耗再乘 (social_g.off + G / social_g.div)；
# 晨起（morning_slot）不睡就补 morning_c 点洁；在 duty_layers 里的决定每时辰补 duty_a 点志（履职）；
# 迫切度 u(x) = ((100 - x) / 100)^urgency_pow + urgency_floor；hungry_line / tired_line 只是统计线（报表用）。
["rule:proto60:needs"]
init = { h = 70.0, e = 80.0, c = 70.0, s = 60.0, a = 60.0 }
base = { h = -7.0, e = -6.0, c = -1.0, s = -1.6, a = -3.0 }
names = { h = "饥", e = "困", c = "洁", s = "群", a = "志" }
category_default = "其他"
hunger_sleep = -3
hunger_t_mid = 40
hunger_t_div = 400
social_g = { off = 0.5, div = 100 }
morning_slot = 2
morning_c = 6
duty_layers = ["岗位", "值守"]
duty_a = 6
urgency_floor = 0.05
urgency_pow = 2
hungry_line = 25
tired_line = 20

# 生病：每人每日抽签，概率 p；病 min_days + [0, span) 日。
["rule:proto60:illness"]
p = 0.004
min_days = 1
span = 3
