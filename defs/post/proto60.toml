# ---------------------------------------------------------------- 工作板上的差事（计划 7.1）
# 每日发布一张；认领次序按 prio 升序，同级按 order；prio 数字小的先被认领。认领即预约。
# count 当日需要几人；outputs 每名完成者给库存入账的物（挑水得水、打柴得柴）。
["job:proto60:fetch_water"]
order = 1
prio = 1
name = "挑水"
