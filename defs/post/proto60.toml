["rule:proto60:board"]
work_chat_p = 0.6

# ---------------------------------------------------------------- 性格刻度（键 D 精进 S 守戒 G 合群 T 馋 R 刚正；0–100，开局按 N(mean, sd) 生成再夹到 [lo, hi]）
