# 岗位（v0.2 的 SITE 与 CRITICAL）。id 的最后一段是内核用的角色名（如 supervisor = 监院），name 是库里存的岗位名。
# site：岗位的站点（上锁场所的“钥匙”、作息里的“执事”处）；副职沿用正职的站点（名字 = 副职前缀 + name）。
# critical：关键岗位的检查次序（1 起）；关键岗位无人任职超过 K.vac_limit 日记违规。hall：该岗位是某院堂的首座，继任只从该院堂选。

