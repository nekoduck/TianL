# NPC 原型场景 scenario:proto60 的想法、好恶修正项、事件显著度与几条站点级规则（好恶底数、闲谈、传闻、心情、自由时段）。
# 角色名 = 编号最后一段：thought / modifier 的最后一段是引擎与规范里引用的键；event 的 code 是 tianl/npc/events.py 登记的事件类型代码。

