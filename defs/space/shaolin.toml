# 少林寺内核用到的场所（v0.2 的 PLACE_NAME）。code 是运行时钥匙，数据库与事件日志里的场所一律用 code。
# order 即原型字典顺序：place 表按此顺序插入，状态哈希按 rowid 遍历，所以不得改动顺序。
# access = locked_night 的场所夜间（见 org:shaolin:main 的 lock_slots）无钥匙不得进入。
# 住处 SH_DORM_n 不是场所表里的行，由 org:shaolin:main 的 dorm 规则生成，故不在此列。

